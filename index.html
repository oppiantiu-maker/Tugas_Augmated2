<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR Kelompok 5 - Minggu 2 (Scene v1)</title>
  <!-- Library A-Frame versi 1.3.0 -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <!-- SKRIP ANIMASI MANUAL -->
  <script>
    // Komponen untuk memutar silinder
    AFRAME.registerComponent('putar-otomatis', {
      tick: function () {
        this.el.object3D.rotation.y += 0.025; 
      }
    });

    // Komponen untuk menggerakkan bola naik-turun (bouncing)
    AFRAME.registerComponent('gerak-bulat', {
      init: function () {
        this.waktu = 0;
      },
      tick: function (time, timeDelta) {
        this.waktu += timeDelta * 0.003;
        this.el.object3D.position.y = 0.3 + Math.sin(this.waktu) * 0.15;
      }
    });
  </script>
</head>
<body style="margin: 0px; overflow: hidden;">

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- PENCAHAYAAN -->
    <a-light id="lampu-ambient" type="ambient" color="#ffffff" intensity="0.6"></a-light>
    <a-light id="lampu-directional" type="directional" color="#ffffff" intensity="0.8" position="1 3 2"></a-light>

    <!-- MARKER HIRO -->
    <a-marker preset="hiro">

      <!-- Alas Datar (Kembali Menggunakan Warna Solid/Biasa) -->
      <a-plane id="alas-bidang" position="0 0 0" rotation="-90 0 0" width="2" height="2"
               color="#e9e5fa" opacity="0.7" transparent="true"></a-plane>

      <a-entity id="kelompok-objek-utama" position="0 0 0">

        <!-- Objek 1: Kubus -->
        <a-box id="kubus-biru" position="-0.6 0.25 0" width="0.5" height="0.5" depth="0.5"
               color="#4C6EF5"></a-box>

        <!-- Objek 2: Bola Bulat (Bergerak Naik-Turun) -->
        <a-sphere id="bola-oranye" position="0 0.3 0" radius="0.3"
                  color="#D9531E" metalness="0.3" roughness="0.4"
                  gerak-bulat></a-sphere>

        <!-- Objek 3: Silinder (Berputar) -->
        <a-cylinder id="silinder-animasi" position="0.6 0.3 0" radius="0.2" height="0.6" color="#0B7F73"
                    putar-otomatis>
        </a-cylinder>

        <!-- Objek 4: Kotak Bagian Bawah (Satu-satunya yang Menggunakan Tekstur JPG) -->
        <a-box id="kotak-tekstur" position="0 0.15 0.7" width="0.5" height="0.3" depth="0.5"
               src="assets/tekstur.jpg"></a-box>

      </a-entity>

    </a-marker>

    <!-- KAMERA -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
